name: Surgical Board Master Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Compile, Unit Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit & Remove Stray Duplicate Kotlin Files
        run: |
          echo "=== Auditing Kotlin source files for accidental duplicates ==="
          # Trim accidental leading/trailing spaces in directory or file names
          find app/src -depth -name "* *" -execdir bash -c 'mv "$1" "${1// /}"' _ {} \; || true
          
          # Find if RepositoryModule is declared in more than one file and keep only the canonical one
          CANONICAL_REPO_MOD="app/src/main/java/com/surgicalboardmaster/app/di/RepositoryModule.kt"
          grep -rl "object RepositoryModule\|class RepositoryModule" app/src/ | while read -r file; do
            if [ "$file" != "$CANONICAL_REPO_MOD" ]; then
              echo "Removing duplicate RepositoryModule declaration in: $file"
              rm -f "$file"
            fi
          done

          # Find duplicate filenames across app/src/main/java and list them clearly
          find app/src/main/java -type f -name "*.kt" | awk -F/ '{print $NF, $0}' | sort | awk '
            prev == $1 { print "WARNING - Duplicate file name detected: " $2 " (already seen in " prev_path ")"; system("rm -f \"" $2 "\"") }
            { prev = $1; prev_path = $2 }
          '

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Version 8.9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Clean, Run Kotlin Compilation & Unit Tests
        run: gradle clean testDebugUnitTest --no-build-cache --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-build-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: surgical-board-master-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
