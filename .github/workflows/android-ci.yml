name: Surgical Board Master Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Compile & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ☢️ Nuclear Clean (Force Delete Generated Files)
        run: |
          echo "Obliterating old build directories to fix KSP cache issues..."
          rm -rf app/build/
          rm -rf build/
          rm -rf .gradle/
          echo "Clean up complete. Ready for a 100% cold start."

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (No Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Assemble Debug APK (Fresh Build)
        run: ./gradlew assembleDebug --no-build-cache --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: surgical-board-master-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
