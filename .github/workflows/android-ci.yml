name: Surgical Board Master Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Compile, Unit Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Nuke Ghost Databases & Duplicates (Smart Clean)
        run: |
          echo "=== Searching and destroying old conflicting database files ==="
          # This command finds any file with @Database EXCEPT SbmDatabase.kt and deletes it
          find app/src -type f -name "*.kt" -exec grep -l "@Database" {} + | grep -v "SbmDatabase.kt" | while read -r file; do
            echo "🚨 Deleting ghost DB file to fix KSP: $file"
            rm -f "$file"
          done
          
          echo "=== Cleaning up duplicate DI modules ==="
          find app/src -type f -name "*.kt" -exec grep -l "object RepositoryModule" {} + | grep -v "app/src/main/java/com/surgicalboardmaster/app/di/RepositoryModule.kt" | while read -r file; do
            echo "🚨 Deleting duplicate module: $file"
            rm -f "$file"
          done

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Version 8.9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Clean & Run Kotlin Compilation
        run: gradle clean kspDebugKotlin --no-build-cache || gradle clean testDebugUnitTest --no-build-cache

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-build-cache

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: surgical-board-master-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
